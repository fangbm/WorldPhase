plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// WPH-013 predeclared seeds; see TUTORIAL_SEARCH_VALIDATION_PLAN.md.
def tutorialSeeds = [0L, 1L, -1L, 42L, 8675309L, 20261009L, 123456789L,
                     987654321L, -7046029254386353131L, Long.MAX_VALUE]
def tutorialProtocol = providers.gradleProperty('tutorialProtocol').orElse('legacy').get()
if (!(tutorialProtocol in ['legacy', 'attribution', 'refined'])) throw new GradleException('tutorialProtocol must be legacy, attribution or refined')
if(tutorialProtocol=='refined') tutorialSeeds += [314159265L, 271828182L, 20260711L, -20260930L, Long.MIN_VALUE]
def tutorialReportName = tutorialProtocol == 'refined' ? 'refined-report.json' : tutorialProtocol == 'attribution' ? 'attribution-report.json' : 'tutorial-report.json'
def tutorialSummaryPath = tutorialProtocol == 'refined' ? 'tutorial-refined/summary.json' : tutorialProtocol == 'attribution' ? 'tutorial-attribution/summary.json' : 'tutorial-verification/summary.json'

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Isolated Phase acceptance tooling, never packaged in the gameplay mod.
sourceSets {
    phaseVerification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    runs {
        tutorialSeeds.eachWithIndex { seed, index ->
            create("phaseVerificationTutorialSeed${index}Server") {
                server()
                sourceSet = sourceSets.phaseVerification
                gameDirectory = project.file("run/tutorial-verification-server/seed-${index}")
                programArgument '--nogui'
                systemProperty 'worldphase.verification', 'tutorial'
                systemProperty 'worldphase.tutorial.protocol', tutorialProtocol
            }
        }
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        densitySmokeServer {
            server()
            gameDirectory = project.file('run/density-smoke-server')
            programArgument '--nogui'
        }
        phaseVerificationServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/phase-verification-server')
            programArgument '--nogui'
        }
        phaseVerificationSamplingServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/terrain-sampling-verification-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'terrain-sampling'
        }
        phaseVerificationTransferServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/phase-transfer-verification-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'phase-transfer'
        }
        phaseVerificationCommandsServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/command-verification-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'commands'
        }
        phaseVerificationCommandsNativeServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/command-native-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'commands-native'
        }
        phaseVerificationCoreColdServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/core-regression-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'core-regression'
            systemProperty 'worldphase.core.stage', 'cold'
            systemProperty 'worldphase.core.failInvariant', providers.gradleProperty('coreRegressionFailInvariant').orElse('').get()
        }
        phaseVerificationCoreReloadServer {
            server()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/core-regression-server')
            programArgument '--nogui'
            systemProperty 'worldphase.verification', 'core-regression'
            systemProperty 'worldphase.core.stage', 'reload'
            systemProperty 'worldphase.core.failInvariant', providers.gradleProperty('coreRegressionFailInvariant').orElse('').get()
        }
        commandClient {
            client()
            gameDirectory = project.file('run/command-client')
            programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25572', '--username', 'WPH011Review')
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        phaseVerificationClient {
            client()
            sourceSet = sourceSets.phaseVerification
            gameDirectory = project.file('run/phase-verification-client')
            programArguments.addAll('--quickPlaySingleplayer', 'wph007')
            programArguments.addAll('--width', '1280', '--height', '720')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        worldphase_verification {
            sourceSet(sourceSets.phaseVerification)
        }
    }

    runs.configureEach {
        loadedMods = name.startsWith('phaseVerification')
                ? [mods.worldphase, mods.worldphase_verification] : [mods.worldphase]
    }

    unitTest {
        enable()
        testedMod = mods.worldphase
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.21.0'
}

// Development-only profiler: no Minecraft runtime, benchmark library, or mod packaging.
sourceSets {
    profiling {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    profilingTest {
        compileClasspath += sourceSets.main.output + sourceSets.profiling.output + sourceSets.phaseVerification.output
        runtimeClasspath += sourceSets.main.output + sourceSets.profiling.output + sourceSets.phaseVerification.output
    }
}

dependencies {
    profilingTestImplementation platform('org.junit:junit-bom:5.13.4')
    profilingTestImplementation 'org.junit.jupiter:junit-jupiter'
    profilingTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain JUnit keeps dev tooling tests outside NeoForge's transforming mod class loader.
def testNoiseProfiler = tasks.register('testNoiseProfiler', Test) {
    group = 'verification'
    description = 'Test profiling statistics/workload and pure core invariant report accounting.'
    testClassesDirs = sourceSets.profilingTest.output.classesDirs
    classpath = sourceSets.profilingTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check').configure {
    dependsOn testNoiseProfiler
}

tasks.register('noiseProfile', JavaExec) {
    group = 'verification'
    description = 'Profile deterministic noise kernels (development tooling only).'
    classpath = sourceSets.profiling.runtimeClasspath
    mainClass = 'dev.fangbm.worldphase.dev.noise.NoiseProfiler'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    args providers.gradleProperty('noiseProfileKernel').orElse('all').get(),
            providers.gradleProperty('noiseProfileSamples').orElse('1000000').get()
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The transforming test loader does not expose Vanilla data resources via getResource.
    systemProperty 'worldphase.minecraftJar', layout.buildDirectory.file("moddev/artifacts/minecraft-patched-${neo_version}.jar").get().asFile.absolutePath
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forward terminal input so runServer supports a graceful `stop`.
tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

tasks.named('runPhaseVerificationServer', JavaExec).configure {
    standardInput = System.in
    def statusFile = project.file('run/phase-verification-server/phase-verification-status.txt')
    doFirst { statusFile.delete() }
    doLast {
        if (!statusFile.exists() || statusFile.text.trim() != 'PASS') {
            throw new GradleException('Phase acceptance probe did not pass; inspect the isolated server log/status.')
        }
    }
}

tasks.named('runPhaseVerificationSamplingServer', JavaExec).configure {
    def statusFile = project.file('run/terrain-sampling-verification-server/terrain-sampling-status.txt')
    doFirst { statusFile.delete() }
    doLast {
        if (!statusFile.exists() || statusFile.text.trim() != 'PASS') {
            throw new GradleException('Terrain sampling probe did not pass; inspect its isolated server log/status.')
        }
    }
}

tasks.named('runPhaseVerificationTransferServer', JavaExec).configure {
    def statusFile = project.file('run/phase-transfer-verification-server/phase-transfer-status.txt')
    doFirst { statusFile.delete() }
    doLast {
        if (!statusFile.exists() || statusFile.text.trim() != 'PASS') {
            throw new GradleException('Phase transfer probe did not pass; inspect its isolated server log/status.')
        }
    }
}

tasks.named('runPhaseVerificationCommandsServer', JavaExec).configure {
    def statusFile = project.file('run/command-verification-server/command-status.txt')
    doFirst { statusFile.delete() }
    doLast {
        if (!statusFile.exists() || statusFile.text.trim() != 'PASS') {
            throw new GradleException('Command acceptance probe failed; inspect its isolated log/status.')
        }
    }
}
tasks.named('runPhaseVerificationCommandsNativeServer', JavaExec).configure {
    standardInput = System.in
}

// WPH-012 reuses all existing test suites. No alternate Minecraft test loader or framework.
def coreRegression = tasks.register('coreRegression') {
    group = 'verification'
    description = 'Run all unit core regressions and development report/profiler tests.'
    dependsOn tasks.named('test'), testNoiseProfiler
}

def prepareTutorialVerification = tasks.register('prepareTutorialVerification') {
    doLast {
        def root = project.file('run/tutorial-verification-server')
        root.mkdirs()
        def summary=layout.buildDirectory.file(tutorialSummaryPath).get().asFile
        summary.parentFile.mkdirs()
        summary.text=groovy.json.JsonOutput.toJson([status:'RUNNING', failure:'server.did_not_complete'])
        def eula = new File(root, 'eula.txt')
        if (providers.gradleProperty('tutorialAcceptEula').orElse('false').get().toBoolean()) eula.text = 'eula=true\n'
        if (!eula.exists() || !(eula.text =~ /(?m)^\s*eula\s*=\s*true\s*$/).find()) {
            throw new GradleException('Accept Minecraft EULA in run/tutorial-verification-server/eula.txt or use -PtutorialAcceptEula=true after reading https://aka.ms/MinecraftEULA')
        }
        tutorialSeeds.eachWithIndex { seed,index ->
            def directory = new File(root,"seed-${index}"); directory.mkdirs()
            new File(directory,tutorialReportName).text=groovy.json.JsonOutput.toJson([status:'PENDING', seed:seed])
            new File(directory,'eula.txt').text=eula.text
            new File(directory,'server.properties').text="""level-name=world-wph013-${UUID.randomUUID()}
level-seed=${seed}
pause-when-empty-seconds=0
server-ip=127.0.0.1
server-port=25575
online-mode=false
gamemode=creative
spawn-protection=0
view-distance=2
simulation-distance=2
max-tick-time=-1
"""
        }
    }
}
def tutorialRuns=[]
tutorialSeeds.eachWithIndex { seed,index ->
    def run=tasks.named("runPhaseVerificationTutorialSeed${index}Server", JavaExec) {
        dependsOn prepareTutorialVerification
        if(index>0) dependsOn tasks.named("runPhaseVerificationTutorialSeed${index-1}Server")
        def report=project.file("run/tutorial-verification-server/seed-${index}/${tutorialReportName}")
        doFirst { report.text=groovy.json.JsonOutput.toJson([status:'RUNNING', seed:seed, failure:'server.did_not_complete']) }
        doLast {
            def data=new groovy.json.JsonSlurper().parse(report)
            if(data.status!='PASS' || data.seed!=seed || data.repeatRanking!='PASS' || data.baseSearchFullChunkRequests!=0)
                throw new GradleException("Tutorial seed=${seed} failed: ${data.failure}; report=${report}")
        }
    }
    tutorialRuns.add(run)
}
tasks.register('tutorialVerification') {
    group='verification'
    description='Validate the fixed ten tutorial seeds, repeats, maximum workload and actual FULL observations.'
    dependsOn tutorialRuns
    doLast {
        def reports=(0..<tutorialSeeds.size()).collect { new groovy.json.JsonSlurper().parse(project.file("run/tutorial-verification-server/seed-${it}/${tutorialReportName}")) }
        int useful=reports.take(10).count { it.usefulTop1 }
        def destination=layout.buildDirectory.file(tutorialSummaryPath).get().asFile
        destination.parentFile.mkdirs()
        def aggregate=[status:useful>=7?'PASS':'QUALITY_SHORTFALL', correctnessStatus:'PASS', usefulSeeds:useful, totalSeeds:10,
                majorityMet:useful>=7, protocol:tutorialProtocol, reports:reports]
        if(tutorialProtocol=='refined') {
            aggregate.originalTop3Useful=reports.take(10).count { it.usefulTop3 }
            aggregate.originalTop1Shift=reports.take(10).count { it.shiftTop1 }
            aggregate.originalTop3Shift=reports.take(10).count { it.shiftTop3 }
            aggregate.holdout=[count:5, top1Useful:reports.drop(10).count { it.usefulTop1 }, top3Useful:reports.drop(10).count { it.usefulTop3 },
                    top1Shift:reports.drop(10).count { it.shiftTop1 }, top3Shift:reports.drop(10).count { it.shiftTop3 }]
        }
        destination.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(aggregate))
        logger.lifecycle("Tutorial correctness PASS; useful actual Top1=${useful}/10 (target7/10); report=${destination}")
    }
}

def prepareCoreRegressionServer = tasks.register('prepareCoreRegressionServer') {
    group = 'verification'
    description = 'Prepare an isolated fixed-seed fresh world, preserving earlier test worlds.'
    doLast {
        def directory = project.file('run/core-regression-server')
        directory.mkdirs()
        def summary = layout.buildDirectory.file('core-regression/summary.json').get().asFile
        summary.parentFile.mkdirs()
        summary.text = groovy.json.JsonOutput.toJson([status:'RUNNING', failedInvariant:'server.did_not_complete',
                reports:['run/core-regression-server/core-cold.json', 'run/core-regression-server/core-reload.json']])
        def eula = new File(directory, 'eula.txt')
        if (providers.gradleProperty('coreRegressionAcceptEula').orElse('false').get().toBoolean()) {
            eula.text = 'eula=true\n'
        }
        if (!eula.exists() || !(eula.text =~ /(?m)^\s*eula\s*=\s*true\s*$/).find()) {
            throw new GradleException('Core server requires an accepted Minecraft EULA: https://aka.ms/MinecraftEULA . Set run/core-regression-server/eula.txt or use -PcoreRegressionAcceptEula=true after reading it.')
        }
        // Run identity is random; seed, coordinate workload and gameplay behavior are fixed.
        // A new name guarantees a cold run without deleting any previous world directory.
        def world = "world-wph012-${UUID.randomUUID()}"
        new File(directory, 'server.properties').text = """level-name=${world}
level-seed=123456789
server-ip=127.0.0.1
server-port=25574
online-mode=false
gamemode=creative
spawn-protection=0
view-distance=2
simulation-distance=2
max-tick-time=-1
"""
        new File(directory, 'core-run-world.txt').text = world + '\n'
    }
}

def coreCold = tasks.named('runPhaseVerificationCoreColdServer', JavaExec) {
    dependsOn prepareCoreRegressionServer
    mustRunAfter coreRegression
}
def coreReload = tasks.named('runPhaseVerificationCoreReloadServer', JavaExec) {
    dependsOn coreCold
}
['Cold': 'cold', 'Reload': 'reload'].each { title, stage ->
    tasks.named("runPhaseVerificationCore${title}Server", JavaExec).configure {
        def reportFile = project.file("run/core-regression-server/core-${stage}.json")
        doFirst {
            reportFile.parentFile.mkdirs()
            reportFile.text = groovy.json.JsonOutput.toJson([status:'RUNNING', stage:stage, failedInvariant:'server.did_not_complete'])
        }
        doLast {
            def report = new groovy.json.JsonSlurper().parse(reportFile)
            if (report.status != 'PASS' || report.completeCycles != 50 || report.loopTransfers != 200) {
                throw new GradleException("Core ${stage} failed: invariant=${report.failedInvariant}, scenario=${report.scenario}, reason=${report.failure}; report=${reportFile}")
            }
        }
    }
}
def coreRegressionServer = tasks.register('coreRegressionServer') {
    group = 'verification'
    description = 'Run 50 real four-Phase cycles on cold startup and another 50 after save/stop/reload.'
    dependsOn coreReload
    doLast {
        def directory = project.file('run/core-regression-server')
        def cold = new groovy.json.JsonSlurper().parse(new File(directory, 'core-cold.json'))
        def reload = new groovy.json.JsonSlurper().parse(new File(directory, 'core-reload.json'))
        if (reload.saveReloadCheck?.startsWith('PASS:') != true) {
            throw new GradleException('Core reload did not verify the persisted checkpoint; inspect core-reload.json')
        }
        def summary = [status:'PASS', minecraft:reload.minecraft, neoforge:reload.neoforge, java:reload.java,
                       seed:reload.seed, world:new File(directory,'core-run-world.txt').text.trim(),
                       completeCycles:cold.completeCycles+reload.completeCycles,
                       loopTransfers:cold.loopTransfers+reload.loopTransfers,
                       successfulTransfers:cold.successfulTransfers+reload.successfulTransfers,
                       maxXzDeviation:Math.max(cold.maxXzDeviation,reload.maxXzDeviation),
                       maxYawPitchDeviation:Math.max(cold.maxYawPitchDeviation,reload.maxYawPitchDeviation),
                       maxYCorrection:Math.max(cold.maxYCorrection,reload.maxYCorrection),
                       inventoryIdentityAndContentChecks:cold.inventoryIdentityAndContentChecks+reload.inventoryIdentityAndContentChecks,
                       duplicatePlayerEntities:0, droppedTestItemEntities:0, saveReloadCheck:reload.saveReloadCheck,
                       stages:[cold:cold, reload:reload]]
        def destination = layout.buildDirectory.file('core-regression/summary.json').get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(summary))
        logger.lifecycle("Core PASS: ${summary.completeCycles} complete cycles / ${summary.loopTransfers} loop shifts; ${summary.successfulTransfers} total including recovery. Report: ${destination}")
    }
}
tasks.register('coreRegressionAll') {
    group = 'verification'
    description = 'Complete headless acceptance: all unit suites plus real cold and reloaded core server regressions.'
    dependsOn coreRegression, coreRegressionServer
}

tasks.named('runPhaseVerificationClient', JavaExec).configure {
    def clientDirectory = project.file('run/phase-verification-client')
    def statusFile = new File(clientDirectory, 'phase-visual-status.txt')
    doFirst {
        statusFile.delete()
        (0..<3).each { view ->
            ['overworld', 'smooth', 'ridge', 'cell', 'fracture'].each { phase ->
                new File(clientDirectory, "screenshots/wph007-${view}-${phase}.png").delete()
            }
        }
    }
    doLast {
        if (!statusFile.exists() || statusFile.text.trim() != 'PASS') {
            throw new GradleException('Phase native client verification did not finish; inspect its log.')
        }
    }
}

// Isolated Vanilla server with an unused density JSON fixture; no Phase dimension/preset.
def prepareDensitySmokeFixture = tasks.register('prepareDensitySmokeFixture', Copy) {
    from 'src/test/resources/datapacks/phase-noise-fixture'
    into 'run/density-smoke-server/world/datapacks/phase-noise-fixture'
}
tasks.named('runDensitySmokeServer', JavaExec).configure {
    dependsOn prepareDensitySmokeFixture
    standardInput = System.in
}
