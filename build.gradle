plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.worldphase
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.21.0'
}

// Development-only profiler: no Minecraft runtime, benchmark library, or mod packaging.
sourceSets {
    profiling {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    profilingTest {
        compileClasspath += sourceSets.main.output + sourceSets.profiling.output
        runtimeClasspath += sourceSets.main.output + sourceSets.profiling.output
    }
}

dependencies {
    profilingTestImplementation platform('org.junit:junit-bom:5.13.4')
    profilingTestImplementation 'org.junit.jupiter:junit-jupiter'
    profilingTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain JUnit keeps dev tooling tests outside NeoForge's transforming mod class loader.
def testNoiseProfiler = tasks.register('testNoiseProfiler', Test) {
    group = 'verification'
    description = 'Test profiling statistics and deterministic workload (no timing assertions).'
    testClassesDirs = sourceSets.profilingTest.output.classesDirs
    classpath = sourceSets.profilingTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check').configure {
    dependsOn testNoiseProfiler
}

tasks.register('noiseProfile', JavaExec) {
    group = 'verification'
    description = 'Profile deterministic noise kernels (development tooling only).'
    classpath = sourceSets.profiling.runtimeClasspath
    mainClass = 'dev.fangbm.worldphase.dev.noise.NoiseProfiler'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    args providers.gradleProperty('noiseProfileKernel').orElse('all').get(),
            providers.gradleProperty('noiseProfileSamples').orElse('1000000').get()
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forward terminal input so runServer supports a graceful `stop`.
tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}
